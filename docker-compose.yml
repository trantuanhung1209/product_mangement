# Full stack: PostgreSQL, Redis, MinIO, API and Nginx (static frontend + /api proxy).
# Run:  cp .env.docker.example .env.docker  (fill the secrets), then
#       docker compose --env-file .env.docker up --build -d
# Dev mode (infra only, app on the host) stays in infra/compose.yml.
name: product-catalog-stack

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.docker
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  minio:
    # Same image as infra/compose.yml. Pick the -amd64 tag on Intel/Linux hosts.
    image: ${MINIO_IMAGE:-firstfinger/minio:latest-arm64}
    env_file: .env.docker
    command: /usr/bin/minio server /data --console-address ":9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env.docker
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    networks:
      internal:
        # Fixed address so TRUSTED_PROXY_IPS can name exactly this proxy.
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  redis-data:
  minio-data:
