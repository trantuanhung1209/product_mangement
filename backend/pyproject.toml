[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-catalog-api"
version = "0.1.0"
description = "FastAPI foundation for Product Catalog"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
